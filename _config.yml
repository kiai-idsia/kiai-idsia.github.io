# =============================================================================
#  Knowledge-Informed AI group website
#  Settings for the whole site. Restart `jekyll serve` after editing this file.
# =============================================================================

title: Knowledge-Informed AI
short_title: KIAI
# The home page title is "title | tagline" (shown by search engines).
tagline: KIAI group, IDSIA USI-SUPSI, Lugano
description: >-
  The Knowledge-Informed AI group (KIAI) at IDSIA USI-SUPSI (Lugano, Switzerland)
  develops machine learning methods that combine data with prior knowledge:
  physics-informed machine learning, causal AI and probabilistic graphical
  models, and federated learning, with applications in healthcare, life
  sciences and industry.
lang: en

# --- Address of the site ------------------------------------------------------
# Full address of the published site. It is used for the canonical links,
# the sitemap and the link previews. Change it only if the site moves (for
# example to a custom domain).
url: "https://kiai-idsia.github.io"
baseurl: ""

# --- Institution and contact --------------------------------------------------
institution: IDSIA USI-SUPSI
institution_long: Dalle Molle Institute for Artificial Intelligence (IDSIA USI-SUPSI)
institution_url: https://www.idsia.ch
location: Lugano, Switzerland
contact:
  name: Laura Azzimonti
  email: laura.azzimonti@supsi.ch
  address:
    - IDSIA USI-SUPSI
    - Polo universitario Lugano, Campus Est
    - Via la Santa 1
    - 6962 Lugano-Viganello, Switzerland

# Names of group members, written as in author lists. They are shown in bold
# in the publication lists.
highlight_authors:
  - L. Azzimonti
  - D. Malpetti
  - L. Multerer
  - C. Galimberti
  - G. Angelotti
  - M. Acquistapace
  - C. Berchtold

# --- Metadata for search engines and link previews (jekyll-seo-tag) ------------
image: /assets/img/brand/social-card.png
author: Laura Azzimonti

# Description of the group for search engines (structured data on the home page,
# file _includes/structured-data.html): logo and pages of the group on other
# sites. Add here, for example, the address of a group page on idsia.ch.
group_logo: /assets/img/brand/kiai-mark.png
same_as:
  - https://github.com/kiai-idsia

# Verification codes for Google Search Console and Bing Webmaster Tools.
# Choose the method "HTML tag" and copy only the value of content="...".
# Remove the "#" in front of the lines when the code is available.
# webmaster_verifications:
#   google: "PASTE-THE-GOOGLE-CODE-HERE"
#   bing: "PASTE-THE-BING-CODE-HERE"

# --- Collections ---------------------------------------------------------------
# Projects are stored in _projects/. Each project has its own page at
# /projects/<file name>/ and is listed on the Projects page and on the pages
# of its research lines.
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/img/brand/social-card.png
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      seo:
        type: WebPage

# --- Build settings (compatible with the standard GitHub Pages build) -----------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - CONTENT-GUIDE.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts
  - esempi
  - materiali
  - note
  - versioni
  - "*.pptx"
  - "CV*"
  - .jekyll-cache

# Publications of the group.
#
# Fields
#   id        unique key (also the anchor on the Publications page)
#   year      publication year
#   type      journal | conference | preprint
#   status    optional, e.g. "Under review" (listed under "Submitted")
#   authors   as in the paper; names listed in _config.yml (highlight_authors)
#             are shown in bold
#   title, venue, details
#   doi       DOI only (without https://doi.org/)
#   url       alternative link when there is no DOI
#   code      link to code or software
#   pdf       link to an open-access version or preprint
#   lines     research lines (ids in _data/themes.yml): physics-informed,
#             causal, federated. Shown as tags, used by the filters and by
#             the research line pages
#   domains   application domains (ids in _data/domains.yml): health,
#             lifesci, industry, environment. Shown as tags and filters
#   selected  true to show in "Selected publications"
#   selected_theme  research line under which a selected paper is grouped
#   note      one sentence on the contribution (shown for selected papers)
#   home      not used at the moment (was the position on the home page)
#   publications_page  false to show the paper only on the pages of its
#             research lines (not on the Publications page)
#
# Keep the list ordered from newest to oldest.
# Source: CV (indexed publications), October 2026. DOIs, volumes and pages
# checked against Crossref and the publishers on 25 October 2026.


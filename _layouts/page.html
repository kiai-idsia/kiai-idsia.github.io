---
layout: default
---
<header class="page-header">
  <div class="container">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</header>
<div class="page-body{% if page.narrow %} page-body-narrow{% endif %}">
  {{ content }}
</div>

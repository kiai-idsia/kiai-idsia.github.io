<svg class="hero-svg" viewBox="0 0 560 440" role="img" aria-labelledby="hero-svg-title">
  <title id="hero-svg-title">Illustration: a causal graph, data from several sources and a trajectory given by a differential equation, combined in one model.</title>
  <defs>
    <pattern id="hv-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#c6dfe5"/>
    </pattern>
    <marker id="hv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f2730"/>
    </marker>
    <linearGradient id="hv-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#01b4cd" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#01b4cd" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="544" height="424" rx="22" fill="#f2f9fb" stroke="#d6e8ee"/>
  <rect x="8" y="8" width="544" height="424" rx="22" fill="url(#hv-dots)"/>

  <!-- axes -->
  <g stroke="#9fbcc6" stroke-width="1.2">
    <line x1="48" y1="384" x2="520" y2="384"/>
    <line x1="48" y1="384" x2="48" y2="196"/>
  </g>

  <!-- several data sources -->
  <g transform="translate(410 44)">
    <rect x="24" y="0" width="96" height="62" rx="9" fill="#ffffff" stroke="#c6dfe5"/>
    <rect x="12" y="12" width="96" height="62" rx="9" fill="#ffffff" stroke="#c6dfe5"/>
    <rect x="0" y="24" width="96" height="62" rx="9" fill="#ffffff" stroke="#9fbcc6"/>
    <g fill="#0f2730" opacity="0.55">
      <circle cx="18" cy="48" r="3"/><circle cx="32" cy="62" r="3"/><circle cx="46" cy="44" r="3"/>
      <circle cx="58" cy="70" r="3"/><circle cx="72" cy="52" r="3"/><circle cx="82" cy="66" r="3"/>
    </g>
  </g>

  <!-- uncertainty band and trajectory -->
  <path d="M52 352C128 346 160 280 226 258S332 182 402 170S494 152 520 150" fill="none" stroke="url(#hv-band)" stroke-width="34" stroke-linecap="round"/>
  <path d="M52 352C128 346 160 280 226 258S332 182 402 170S494 152 520 150" fill="none" stroke="#017888" stroke-width="3.2" stroke-linecap="round"/>

  <!-- observations -->
  <g fill="#0f2730" opacity="0.45">
    <circle cx="66" cy="356" r="3.6"/><circle cx="90" cy="342" r="3.6"/><circle cx="112" cy="348" r="3.6"/>
    <circle cx="136" cy="326" r="3.6"/><circle cx="158" cy="300" r="3.6"/><circle cx="182" cy="290" r="3.6"/>
    <circle cx="206" cy="262" r="3.6"/><circle cx="234" cy="262" r="3.6"/><circle cx="258" cy="236" r="3.6"/>
    <circle cx="286" cy="222" r="3.6"/><circle cx="312" cy="196" r="3.6"/><circle cx="340" cy="192" r="3.6"/>
    <circle cx="366" cy="172" r="3.6"/><circle cx="394" cy="178" r="3.6"/><circle cx="420" cy="160" r="3.6"/>
    <circle cx="448" cy="164" r="3.6"/><circle cx="474" cy="150" r="3.6"/><circle cx="500" cy="156" r="3.6"/>
  </g>

  <!-- causal graph -->
  <g stroke="#0f2730" stroke-width="1.8" fill="none">
    <line x1="102" y1="104" x2="146" y2="150" marker-end="url(#hv-arrow)"/>
    <line x1="190" y1="72" x2="168" y2="146" marker-end="url(#hv-arrow)"/>
    <line x1="206" y1="68" x2="266" y2="98" marker-end="url(#hv-arrow)"/>
    <line x1="176" y1="162" x2="262" y2="118" marker-end="url(#hv-arrow)"/>
    <line x1="290" y1="128" x2="300" y2="196" stroke-dasharray="4 5" marker-end="url(#hv-arrow)"/>
  </g>
  <g stroke-width="2.4">
    <circle cx="92" cy="94" r="14" fill="#ffffff" stroke="#017888"/>
    <circle cx="198" cy="58" r="14" fill="#01b4cd" stroke="#017888"/>
    <circle cx="160" cy="162" r="14" fill="#ffffff" stroke="#017888"/>
    <circle cx="282" cy="110" r="14" fill="#ffffff" stroke="#017888"/>
  </g>
  <text x="220" y="46" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="17" fill="#017888">do(x)</text>

  <!-- equation -->
  <text x="330" y="300" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="22" fill="#0f2730">dx/dt = f(x, θ)</text>
  <text x="330" y="326" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#3c5560" letter-spacing="0.4">MECHANISTIC KNOWLEDGE</text>
  <text x="62" y="214" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#3c5560" letter-spacing="0.4">CAUSAL STRUCTURE</text>
  <text x="434" y="34" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#3c5560" letter-spacing="0.4">DATA SOURCES</text>
</svg>

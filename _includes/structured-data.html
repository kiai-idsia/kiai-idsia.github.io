{%- comment -%}
  Description of the group for search engines (schema.org), shown on the home
  page. Name, description and address come from _config.yml, the research
  lines from _data/themes.yml, the group leader from _data/people.yml.
{%- endcomment -%}
{%- assign pi = site.data.people.pi -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ResearchOrganization",
  "name": {{ site.title | append: " group" | jsonify }},
  "alternateName": {{ site.short_title | jsonify }},
  "url": {{ "/" | absolute_url | jsonify }},
  "logo": {{ site.group_logo | absolute_url | jsonify }},
  "image": {{ site.image | absolute_url | jsonify }},
  "description": {{ site.description | strip | jsonify }},
  "email": {{ site.contact.email | jsonify }},
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Lugano",
    "addressCountry": "CH"
  },
  "parentOrganization": {
    "@type": "ResearchOrganization",
    "name": {{ site.institution_long | jsonify }},
    "url": {{ site.institution_url | jsonify }}
  },
  "member": {
    "@type": "Person",
    "name": {{ pi.name | jsonify }},
    "jobTitle": "Group leader",
    "url": {{ pi.profile_url | absolute_url | jsonify }}
  },
  "knowsAbout": [{% for t in site.data.themes %}{{ t.title | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %}]
  {%- if site.same_as and site.same_as.size > 0 %},
  "sameAs": {{ site.same_as | jsonify }}
  {%- endif %}
}
</script>
